<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El rayo morado de Vite se reemplazó por el logo real de la tienda. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Cómo se ve la tienda al compartirla (WhatsApp, Facebook, Telegram…) y en
      Google. Sin esto, un enlace a la tienda llegaba pelado: sin imagen ni
      descripción. Los enlaces a un producto (/producto/:id) llevan su propia
      foto, nombre y precio: los pone middleware.js.

      og:url y og:image van con la dirección completa porque así lo exigen
      WhatsApp y Facebook. Si la tienda estrena dominio propio, cambiarlo aquí
      y en public/robots.txt.
    -->
    <meta name="description" content="El súper de la esquina, a un toque. Pide desde el celular y te lo llevamos a la puerta, o pasa a recogerlo." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tienda la 635" />
    <meta property="og:locale" content="es_SV" />
    <meta property="og:title" content="Tienda la 635 — El súper de la esquina, a un toque" />
    <meta property="og:description" content="Pide desde el celular y te lo llevamos a la puerta, o pasa a recogerlo." />
    <meta property="og:url" content="https://cartify-tienda-la635.vercel.app/" />
    <meta property="og:image" content="https://cartify-tienda-la635.vercel.app/compartir.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tiqui, la mascota de Tienda la 635, junto al lema: El súper de la esquina, a un toque" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Instalar la web en el teléfono ("Agregar a la pantalla de inicio"): el
      manifiesto le da nombre e ícono. theme-color pinta la barra del sistema
      del mismo blanco que el encabezado; el script de abajo la oscurece si la
      persona eligió el modo oscuro, y utils/modo.js la sigue al cambiarlo.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-title" content="La 635" />

    <!--
      Abrir la conexión con el servidor y con las fotos desde el primer
      momento, mientras todavía se descarga el código: cuando la tienda pida
      el catálogo y las imágenes, el saludo seguro (DNS + TLS) ya está hecho.
      Son unos cientos de milisegundos menos en teléfono.
    -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin="use-credentials" />
    <link rel="preconnect" href="https://res.cloudinary.com" />


    <!--
      Pinta el color de marca ANTES de que React exista.

      Sin esto, aunque useAjustesTienda.js ya arranque con el color correcto
      en su estado, la variable CSS de verdad (--marca-600 y compañía) solo
      se fija dentro de un useEffect — y un efecto corre DESPUÉS del primer
      pintado del navegador. Ese primer cuadro sale con el café de fábrica
      que declara index.css, se corrige, y el ojo lo ve como un parpadeo.

      Este script no espera a React ni al servidor: lee la escala ya
      calculada que useAjustesTienda.js dejó guardada la última vez (la
      misma tienda, el mismo navegador) y la aplica de una al elemento raíz.
      Si no hay nada guardado todavía (primerísima visita), no hace nada y
      se ve el café de siempre — ahí sí no hay forma de adivinar el color
      antes de preguntarle al servidor.
    -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem('la635_escala_marca_cache');
          if (!guardado) return;
          var escala = JSON.parse(guardado);
          var raiz = document.documentElement.style;
          for (var variable in escala) {
            if (Object.prototype.hasOwnProperty.call(escala, variable)) {
              raiz.setProperty(variable, escala[variable]);
            }
          }
        } catch (error) {
          // Caché corrupta o localStorage bloqueado: se sigue con el café
          // de fábrica, no es motivo para detener la carga de la página.
        }
      })();
    </script>

    <!--
      Claro u oscuro, ANTES del primer cuadro.

      El modo lo elige cada persona en Mi Cuenta → Preferencias y lo aplica
      ModoContext, pero eso corre después de que React arranca: sin este
      script, quien eligió oscuro vería la tienda blanca un instante en cada
      carga. Es la misma lógica de utils/modo.js en pocas líneas; el panel
      (las rutas de RUTAS_DEL_PANEL en utils/sesion.js) nunca se oscurece.
    -->
    <script>
      (function () {
        try {
          var modo = localStorage.getItem('la635_modo');
          var oscuro = modo === 'oscuro' ||
            (modo === 'sistema' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var panel = /^\/(admin|dashboard|inventario|pedidos|modulos|marcas|empleados|clientes|proveedores|categorias|fidelidad|promociones|servicios-impresion|tarjetas|personalizacion|cuenta)(\/|$)/;
          if (oscuro && !panel.test(location.pathname)) {
            document.documentElement.setAttribute('data-modo', 'oscuro');
            // La barra del sistema, del mismo color que el fondo oscuro (--papel).
            var barra = document.querySelector('meta[name="theme-color"]');
            if (barra) barra.setAttribute('content', '#121417');
          }
        } catch (error) {
          // Sin localStorage: se queda en claro.
        }
      })();
    </script>

    <title>Tienda la 635</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
